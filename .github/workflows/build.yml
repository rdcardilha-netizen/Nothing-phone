name: Build Nothing Dots APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Nenhum arquivo ZIP encontrado na raiz do repositório."
            echo "Arquivos encontrados na raiz:"
            ls -la
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"
          mkdir -p proj
          unzip -q "$ZIP_FILE" -d proj

          if [ ! -f proj/settings.gradle.kts ]; then
            echo "Não encontrei settings.gradle.kts diretamente dentro da pasta extraída."
            echo "Estrutura do ZIP:"
            find proj -maxdepth 4 -type f | head -80
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build release APK
        working-directory: proj
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Dots-Launcher-APK
          path: proj/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
